; UNIHIKER K10 — NES (nofrendo) player
; Ported from ducalex/retro-go's nofrendo core to the DFRobot UNIHIKER K10.
[platformio]
default_envs = unihiker

[env:unihiker]
platform = https://github.com/DFRobot/platform-unihiker.git
board = unihiker_k10
framework = arduino
monitor_speed = 115200

; `deep` guarantees the self-contained nofrendo C library is always built.
lib_ldf_mode = deep

; BLE_FFF0 lives in libs/ (not the default lib/), so add it as a search dir.
lib_extra_dirs = libs

; Regenerate src/rom_catalog{,_data}.h from every .nes in games/ before each
; build, so all ROMs are embedded and the menu can list them.
extra_scripts = tools/gen_rom_catalog.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=None
    ; nofrendo is plain C; utils.h selects its standalone branch when
    ; RETRO_GO is undefined (which it is here).
